# Production override for the stack defined in `docker-compose.yml`.
# Bring it up with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env --profile studio up -d --build
#
# Differences vs the dev compose:
#  - Caddy is the only service that publishes ports on the host (80 /
#    443). Backend, frontend, Postgres, and Prisma Studio inherit zero
#    host port bindings from the base `docker-compose.yml`; the dev
#    bindings live in `docker-compose.override.yml` which is NOT
#    loaded when prod is brought up with an explicit `-f` file list.
#    Compose merges `ports` additively, so the prod surface is safe by
#    omission rather than by attempted removal.
#  - Postgres lives on a host bind mount so the data survives a
#    `compose down` and is easy to back up.
#  - `restart: unless-stopped` on every service so a VM reboot brings
#    the stack back automatically.
#  - The frontend's `NEXT_PUBLIC_API_BASE_URL` is inlined at build time
#    so the browser bundle calls `https://${DOMAIN}/api/v1` directly.
#  - Prisma Studio stays gated behind the `studio` profile from the
#    base compose. Pass `--profile studio` to expose it via Caddy at
#    `https://${STUDIO_SUBDOMAIN}/`; omit it for an API-only deploy.
#
# Required env vars (set them in `.env` next to this file):
#   DOMAIN, STUDIO_SUBDOMAIN, ADMIN_EMAIL,
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /var/lib/billpay-data:/var/lib/postgresql/data
    # Override the base compose healthcheck — its `pg_isready -U postgres
    # -d billpay` is hardcoded, but here those values come from the env
    # so a non-default `POSTGRES_USER` / `POSTGRES_DB` would leave the
    # service permanently unhealthy and block backend startup.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: "3001"
    expose:
      - "3001"

  frontend:
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}/api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}/api/v1
    expose:
      - "3000"

  prisma-studio:
    restart: unless-stopped
    # The base compose hardcodes Studio's DATABASE_URL to
    # `postgres:postgres@postgres:5432/billpay` for local dev. In prod,
    # Postgres runs with the operator-provided credentials from `.env`,
    # so without this override Studio authenticates against the wrong
    # password, opens cleanly, and shows every table as 0 rows.
    # Reuse the same DATABASE_URL shape the backend service already has.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    expose:
      - "5555"

  caddy:
    image: caddy:2-alpine
    container_name: billpay-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      STUDIO_SUBDOMAIN: ${STUDIO_SUBDOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Caddy waits on backend health + frontend boot. `prisma-studio` is
    # intentionally NOT listed: it lives behind the `studio` profile in
    # the base compose, so when the operator brings the stack up without
    # `--profile studio` the service is not created and Caddy must still
    # be allowed to start. Caddy resolves `prisma-studio:5555` lazily
    # per request and returns a clean 502 when Studio is absent.
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  caddy-data:
  caddy-config:
