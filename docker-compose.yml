services:
  postgres:
    image: postgres:16-alpine
    container_name: billpay-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billpay
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Pin the image name so the `studio` profile (which references
    # `bill-pay-backend:latest` to reuse this build) resolves regardless
    # of the compose project name. Without an explicit `image:`, Docker
    # would name the build after the directory and Studio would try to
    # pull from a registry on a cold clone.
    image: bill-pay-backend:latest
    container_name: billpay-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/billpay?schema=public
      PORT: "3001"
    restart: unless-stopped
    healthcheck:
      # The Nest health controller answers on `/api/v1/health` once the
      # app has booted and migrations have applied; the frontend waits
      # on this before it starts.
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Opt-in Prisma Studio. Off by default so the standard
  # `docker compose up` stays minimal; bring it up with
  #   `docker compose --profile studio up --build`
  # to inspect the live database at http://localhost:5555 (when the
  # dev port binding from `docker-compose.override.yml` is loaded).
  # Reuses the backend image (Prisma CLI is already inside it). No
  # auth on the Studio UI itself — meant for local review against
  # demo data; the production override puts it behind Caddy basic auth.
  prisma-studio:
    profiles: ["studio"]
    image: bill-pay-backend:latest
    container_name: billpay-studio
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/billpay?schema=public
    command: ["./node_modules/.bin/prisma", "studio", "--port", "5555", "--browser", "none", "--hostname", "0.0.0.0"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # The Next standalone build inlines `NEXT_PUBLIC_*` at build
        # time, so the browser-visible API URL must be set here too,
        # not only at runtime. Reviewers running on `localhost` see the
        # backend exposed at host port 3001 (via the override file
        # auto-loaded for dev), which the browser can reach directly.
        # The production override re-builds with the public HTTPS URL.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
    container_name: billpay-web
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# This file declares no host port bindings. Compose merges `ports`
# additively, so an override file cannot REMOVE a binding declared
# here. To keep prod safe (only Caddy on 80/443), every dev-only host
# port binding lives in `docker-compose.override.yml` — auto-loaded by
# `docker compose up` for local dev and explicitly excluded when prod
# is brought up via `-f docker-compose.yml -f docker-compose.prod.yml`.
volumes:
  postgres-data:
